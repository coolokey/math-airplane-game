<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>七年級數學：正負數加減大冒險 (手勢魔法版 - 50題)</title>

  <!-- PWA 支援 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#050510">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="元素防禦戰">
  
  <!-- 引入 p5.js 與 MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- 引入 Tailwind CSS 與 Google 字體 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      background-color: #070b19; 
      font-family: 'Noto Sans TC', sans-serif; 
      color: white; 
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 50%, #111a3a 0%, #050814 100%);
    }

    #webcam { display: none; }

    /* Wordwall 風格固定比例視窗容器 */
    #gameWrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.2);
      border: 3px solid rgba(56, 189, 248, 0.4);
      background: #0b112c;
    }
    
    #canvasContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    canvas { display: block; }
    
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37), inset 0 0 15px rgba(56, 189, 248, 0.15);
    }

    .font-fredoka { font-family: 'Fredoka', sans-serif; }
    
    .loader {
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
      box-shadow: 0 0 20px #38bdf8;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .heart-icon {
      color: #ff4757;
      filter: drop-shadow(0 0 8px rgba(255, 71, 87, 0.8));
    }
  </style>
</head>
<body>

  <!-- 底層攝影機畫面 (隱藏) -->
  <video id="webcam" autoplay playsinline></video>

  <!-- 遊戲視窗主容器 (16:9 比例框) -->
  <div id="gameWrapper">

    <!-- p5.js Canvas 放置區塊 -->
    <div id="canvasContainer"></div>

    <!-- UI 疊加層 -->
    <div id="ui-layer" class="p-4 sm:p-5 flex flex-col justify-between">
      
      <!-- 頂部資訊與題目列 -->
      <div class="flex justify-between items-center w-full gap-3">
        
        <!-- 左側：計時與狀態 -->
        <div class="glass-card px-4 py-2 rounded-2xl flex items-center gap-4 min-w-[210px]">
          <div>
            <div class="text-[10px] text-sky-300 font-bold uppercase tracking-wider">⏱️ 時間</div>
            <div id="timerDisplay" class="text-lg font-black font-fredoka text-amber-300">0:00</div>
          </div>
          <div class="h-6 w-[2px] bg-sky-500/30"></div>
          <div>
            <div class="text-[10px] text-sky-300 font-bold uppercase tracking-wider">❤️ 生命</div>
            <div id="healthDisplay" class="text-base tracking-widest heart-icon">♥♥♥</div>
          </div>
          <div class="h-6 w-[2px] bg-sky-500/30"></div>
          <div>
            <div class="text-[10px] text-sky-300 font-bold uppercase tracking-wider">⭐ 得分</div>
            <div id="scoreDisplay" class="text-lg font-black font-fredoka text-emerald-400">0 / 50</div>
          </div>
        </div>

        <!-- 中間：題目區塊 ( Wordwall 橫條樣式 ) -->
        <div id="questionContainer" class="glass-card px-6 py-2 rounded-2xl flex-1 max-w-lg text-center border-sky-400/50 shadow-[0_0_25px_rgba(56,189,248,0.25)]">
          <div class="text-[11px] text-sky-300 font-bold mb-0.5" id="questionProgress">第 1 / 50 題</div>
          <div id="questionText" class="text-xl md:text-2xl font-black tracking-wider text-white font-fredoka drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">
            計算載入中...
          </div>
        </div>

        <!-- 右側：手勢說明指南 -->
        <div class="glass-card px-3 py-2 rounded-2xl text-[11px] flex items-center gap-2 border-amber-400/30 hidden sm:flex">
          <div class="text-xl">✌️</div>
          <div>
            <div class="font-bold text-amber-300">氣功控制</div>
            <div class="text-slate-300">併指移動 · 兩指分開發射</div>
          </div>
        </div>
      </div>

      <!-- 遊戲結束畫面 (隱藏) -->
      <div id="gameOverUI" class="absolute inset-0 flex items-center justify-center bg-slate-950/85 backdrop-blur-md z-50 opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="text-center glass-card p-6 rounded-3xl max-w-sm w-full border-sky-400/40 pointer-events-auto">
          <div id="endTitle" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-emerald-400 mb-1 font-fredoka">
            冒險完成！
          </div>
          <p id="endSubText" class="text-sky-200 mb-4 text-xs">你成功的解決了正負數挑戰！</p>
          
          <div class="bg-slate-900/60 rounded-xl p-3 mb-4 text-left space-y-1.5 border border-sky-500/20 text-xs">
            <div class="flex justify-between"><span class="text-slate-400">最終答對：</span><span id="finalScore" class="font-bold text-emerald-400">0 / 50</span></div>
            <div class="flex justify-between"><span class="text-slate-400">正確率：</span><span id="finalAccuracy" class="font-bold text-amber-300">0%</span></div>
            <div class="flex justify-between"><span class="text-slate-400">總共用時：</span><span id="finalTime" class="font-bold text-sky-300">0:00</span></div>
          </div>

          <button onclick="restartGame()" class="w-full py-2.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white rounded-xl font-bold shadow-[0_0_20px_rgba(56,189,248,0.4)] transition-all transform hover:scale-105 active:scale-95 text-sm">
            重新挑戰 (Restart)
          </button>
        </div>
      </div>

    </div>

    <!-- 載入與相機權限畫面 -->
    <div id="loadingUI" class="absolute inset-0 bg-[#0b112c] flex items-center justify-center z-50">
      <div class="text-center glass-card p-6 rounded-3xl max-w-xs">
        <div class="loader"></div>
        <h2 class="text-lg font-bold text-sky-400 drop-shadow-[0_0_10px_rgba(56,189,248,0.5)]">啟動手勢魔法感應器...</h2>
        <p class="text-slate-300 mt-2 text-xs">請允許相機權限，以手掌控制飛船，捏合手指發射能量球！</p>
      </div>
    </div>

  </div>

  <script>
    // --- 遊戲設定與狀態 ---
    const TOTAL_QUESTIONS = 50;
    const MAX_LIVES = 3;

    let gameState = "PLAYING"; // "PLAYING", "GAMEOVER"
    let score = 0;
    let lives = MAX_LIVES;
    let currentQIndex = 0;
    let startTime = 0;
    let elapsedTime = 0;

    let questions = [];
    let cloudEntities = [];
    let bullets = [];
    let particles = [];

    // 手勢控制與飛船狀態
    let handPos = { x: 0, y: 0, isPinch: false };
    let shipPos = { x: 0, y: 0 };
    let pinchCooldown = 0;

    // Web Audio 音效引擎
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      let now = audioCtx.currentTime;

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'shoot') {
        // 模擬經典街機「波動拳 (Hadouken!)」氣功發射音聲 (擬真打擊感音效)
        // 1. 低頻蓄力震撼音波
        let subOsc = audioCtx.createOscillator();
        let subGain = audioCtx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(220, now);
        subOsc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
        subGain.gain.setValueAtTime(0.3, now);
        subGain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        subOsc.connect(subGain);
        subGain.connect(audioCtx.destination);
        subOsc.start(now);
        subOsc.stop(now + 0.25);

        // 2. 高頻氣波撕裂音
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    // --- 題目生成機制 (50 題正負數加減題庫) ---
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestions() {
      questions = [];
      const templates = [
        () => { let a = randInt(1, 30), b = randInt(1, 30); return { q: `${a} + ${b} = ?`, ans: a + b }; },
        () => { let a = randInt(1, 40), b = randInt(1, 40); return { q: `${a} - ${b} = ?`, ans: a - b }; },
        () => { let a = randInt(1, 25), b = randInt(1, 30); return { q: `(-${a}) + ${b} = ?`, ans: -a + b }; },
        () => { let a = randInt(1, 30), b = randInt(1, 25); return { q: `${a} + (-${b}) = ?`, ans: a - b }; },
        () => { let a = randInt(1, 25), b = randInt(25, 50); return { q: `(-${a}) - ${b} = ?`, ans: -a - b }; },
        () => { let a = randInt(1, 30), b = randInt(1, 30); return { q: `${a} - (-${b}) = ?`, ans: a + b }; },
        () => { let a = randInt(1, 25), b = randInt(1, 25); return { q: `(-${a}) - (-${b}) = ?`, ans: -a + b }; },
        () => { let a = randInt(1, 20), b = randInt(1, 20); return { q: `(-${a}) + (-${b}) = ?`, ans: -a - b }; }
      ];

      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        let t = templates[i % templates.length]();
        let wrongAnswers = new Set();
        wrongAnswers.add(t.ans);

        // 生成干擾選項 (包含常見的反號錯誤與近鄰數)
        if (t.ans !== 0) wrongAnswers.add(-t.ans);
        while (wrongAnswers.size < 4) {
          let delta = randInt(-8, 8);
          if (delta !== 0) wrongAnswers.add(t.ans + delta);
        }

        let opts = Array.from(wrongAnswers);
        // 洗牌選項
        opts.sort(() => Math.random() - 0.5);

        questions.push({
          q: t.q,
          ans: t.ans,
          options: opts
        });
      }
    }

    // --- p5.js 初始化與繪製 ---
    function setup() {
      let container = document.getElementById('canvasContainer');
      let w = container.clientWidth;
      let h = container.clientHeight;
      let canvas = createCanvas(w, h);
      canvas.parent('canvasContainer');
      
      shipPos.x = width / 2;
      shipPos.y = height * 0.8;
      
      generateQuestions();
      initMediaPipe();
      loadQuestion(currentQIndex);
      startTime = millis();
    }

    function windowResized() {
      let container = document.getElementById('canvasContainer');
      if (container) {
        resizeCanvas(container.clientWidth, container.clientHeight);
      }
    }

    // --- MediaPipe 初始化 ---
    function initMediaPipe() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65
      });

      hands.onResults(onHandResults);

      const videoElement = document.getElementById('webcam');
      const camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640,
        height: 480
      });
      camera.start();
    }

    function getScreenCoords(mx, my) {
      // 放大水平移動敏感度 (讓手掌在畫面中央 20%~80% 區域移動即可涵蓋全螢幕左右邊界)
      let scaleX = 1.5;
      let rx = (width / 2) + (mx - 0.5) * width * scaleX;
      let ry = my * height;
      return { x: rx, y: ry };
    }

    let wasShooting = false; // 預設狀態

    function onHandResults(results) {
      const loadingUI = document.getElementById('loadingUI');
      if (loadingUI && loadingUI.style.opacity !== '0') {
        loadingUI.style.opacity = '0';
        setTimeout(() => loadingUI.style.display = 'none', 500);
      }

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        let lm = results.multiHandLandmarks[0];
        
        // 判斷食指與中指是否伸直 (y 值越小代表越高，因為螢幕上方 y=0)
        // landmark 8: 食指尖, landmark 6: 食指第二關節
        // landmark 12: 中指尖, landmark 10: 中指第二關節
        let isIndexExtended = lm[8].y < lm[6].y;
        let isMiddleExtended = lm[12].y < lm[10].y;

        // 當食指與中指同時伸出時，為「發射」狀態
        let currentlyShooting = (isIndexExtended && isMiddleExtended);

        // 只要食指有伸出，就以食指作為瞄準/移動的座標
        if (isIndexExtended) {
          let indexTip = getScreenCoords(lm[8].x, lm[8].y);
          handPos.x = indexTip.x;
          handPos.y = indexTip.y;
        }

        // 觸發條件：從「非發射(例如只伸食指)」狀態切換為「發射(伸出兩指)」瞬間發射氣功
        if (!wasShooting && currentlyShooting) {
          if (gameState === "PLAYING") {
            initAudio();
            bullets.push(new HadoukenBall(shipPos.x, shipPos.y - 45));
            playSound('shoot');
          }
        }

        wasShooting = currentlyShooting;
      } else {
        wasShooting = false;
      }
    }

    function loadQuestion(index) {
      if (index >= TOTAL_QUESTIONS) {
        endGame(true);
        return;
      }

      let qData = questions[index];
      document.getElementById('questionProgress').innerText = `第 ${index + 1} / ${TOTAL_QUESTIONS} 題`;
      document.getElementById('questionText').innerText = qData.q;

      // 產生 4 朵帶有數字的飄浮 Wordwall 雲朵
      cloudEntities = [];
      let laneWidth = width / 4;
      for (let i = 0; i < 4; i++) {
        cloudEntities.push(new CloudOption(
          laneWidth * i + laneWidth / 2 + random(-20, 20),
          random(120, 220),
          qData.options[i],
          qData.options[i] === qData.ans
        ));
      }
    }

    // --- 遊戲邏輯與繪製迴圈 ---
    function draw() {
      clear();
      
      // 動態漸層夢幻夜空與星光背景
      drawFancyBackground();

      if (gameState === "PLAYING") {
        updateGame();
      }

      // 繪製遊戲實體
      for (let cloud of cloudEntities) cloud.display();
      for (let b of bullets) b.display();
      for (let p of particles) p.display();

      // 繪製手勢與魔法飛艇
      drawPlayerShip();
    }

    function drawFancyBackground() {
      // 繪製半透明夜空浮雲背景
      noStroke();
      fill(15, 23, 42, 160);
      rect(0, 0, width, height);

      // 背景微小星光裝飾
      fill(255, 255, 255, 120);
      for (let i = 0; i < 20; i++) {
        let sx = (sin(frameCount * 0.01 + i * 100) * 0.5 + 0.5) * width;
        let sy = (cos(frameCount * 0.015 + i * 50) * 0.5 + 0.5) * (height * 0.7);
        circle(sx, sy, (i % 3) + 1);
      }
    }

    function updateGame() {
      // 計時器更新
      elapsedTime = Math.floor((millis() - startTime) / 1000);
      let m = Math.floor(elapsedTime / 60);
      let s = elapsedTime % 60;
      document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

      // 飛艇平滑跟隨手掌座標 (調高 lerp 系數讓跟隨更敏捷)
      shipPos.x = lerp(shipPos.x, handPos.x, 0.35);
      shipPos.y = lerp(shipPos.y, handPos.y, 0.35);
      shipPos.x = constrain(shipPos.x, 50, width - 50);
      shipPos.y = constrain(shipPos.y, 120, height - 50);

      // 更新雲朵
      for (let cloud of cloudEntities) cloud.update();

      // 更新子彈與碰撞檢測
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.update();

        if (b.y < -20) {
          bullets.splice(i, 1);
          continue;
        }

        // 碰撞檢查
        let bulletHit = false;
        for (let cloud of cloudEntities) {
          if (dist(b.x, b.y, cloud.x, cloud.y) < cloud.r + 15) {
            bulletHit = true;
            createExplosion(cloud.x, cloud.y, cloud.isCorrect ? [52, 211, 153] : [248, 113, 113]);

            if (cloud.isCorrect) {
              playSound('correct');
              score++;
              document.getElementById('scoreDisplay').innerText = `${score} / ${TOTAL_QUESTIONS}`;
              currentQIndex++;
              setTimeout(() => loadQuestion(currentQIndex), 300);
            } else {
              playSound('wrong');
              loseLife();
            }
            break;
          }
        }
        if (bulletHit) bullets.splice(i, 1);
      }

      // 更新粒子特效
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }
    }

    function loseLife() {
      lives--;
      let heartsStr = "";
      for (let i = 0; i < lives; i++) heartsStr += "♥";
      for (let i = lives; i < MAX_LIVES; i++) heartsStr += "♡";
      document.getElementById('healthDisplay').innerText = heartsStr;

      if (lives <= 0) {
        endGame(false);
      }
    }

    // --- 實體類別定義 ---

    // 1. Wordwall 風格雲朵
    class CloudOption {
      constructor(x, y, val, isCorrect) {
        this.x = x;
        this.y = y;
        this.baseY = y;
        this.val = val;
        this.isCorrect = isCorrect;
        this.r = 55;
        this.wobbleSpeed = random(0.02, 0.04);
        this.offset = random(100);
      }

      update() {
        // 浮動擺盪效果
        this.y = this.baseY + sin(frameCount * this.wobbleSpeed + this.offset) * 12;
      }

      display() {
        push();
        translate(this.x, this.y);

        // 柔和光暈陰影
        drawingContext.shadowBlur = 20;
        drawingContext.shadowColor = 'rgba(56, 189, 248, 0.4)';

        // 畫蓬鬆 Wordwall 3D 雲朵
        noStroke();
        fill(245, 247, 250);
        ellipse(0, 0, 110, 65);
        ellipse(-30, 5, 60, 50);
        ellipse(30, 5, 65, 52);
        ellipse(-15, -18, 55, 48);
        ellipse(15, -15, 50, 45);

        // 雲朵陰影質感
        fill(218, 226, 239);
        ellipse(0, 12, 95, 35);

        // 數字顯示
        drawingContext.shadowBlur = 0;
        fill(15, 23, 42);
        textSize(32);
        textAlign(CENTER, CENTER);
        textFont('Fredoka');
        textStyle(BOLD);
        text(this.val, 0, -2);

        pop();
      }
    }

    // 2. 街機風格「波動拳」藍耀氣功彈
    class HadoukenBall {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vy = -16;
        this.rotation = 0;
      }

      update() {
        this.y += this.vy;
        this.rotation += 0.25;
        // 藍電氣功尾跡粒子
        particles.push(new Particle(this.x + random(-10, 10), this.y + random(5, 20), [14, 165, 233]));
        particles.push(new Particle(this.x + random(-5, 5), this.y + random(2, 10), [255, 255, 255]));
      }

      display() {
        push();
        translate(this.x, this.y);
        rotate(this.rotation);

        // 氣功波熾藍外層電光光暈
        drawingContext.shadowBlur = 25;
        drawingContext.shadowColor = 'rgba(14, 165, 233, 0.95)';

        noStroke();
        // 外層氣芒
        fill(14, 165, 233, 160);
        ellipse(0, 0, 36, 46);

        // 中層發光體
        fill(125, 211, 252, 220);
        ellipse(0, 0, 26, 34);

        // 核心白光能量核
        fill(255, 255, 255);
        circle(0, 0, 18);

        // 電磁氣芒弧線
        stroke(255, 255, 255, 200);
        strokeWeight(2);
        noFill();
        arc(0, 0, 30, 30, 0, HALF_PI);
        arc(0, 0, 34, 34, PI, PI + HALF_PI);

        pop();
      }
    }

    // 3. 爆炸粒子
    class Particle {
      constructor(x, y, rgbArr) {
        this.x = x;
        this.y = y;
        this.vx = random(-4, 4);
        this.vy = random(-4, 4);
        this.alpha = 255;
        this.color = rgbArr;
        this.size = random(4, 9);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 12;
        this.size *= 0.94;
      }

      display() {
        push();
        noStroke();
        fill(this.color[0], this.color[1], this.color[2], this.alpha);
        circle(this.x, this.y, this.size);
        pop();
      }
    }

    function createExplosion(x, y, rgbArr) {
      for (let i = 0; i < 22; i++) {
        particles.push(new Particle(x, y, rgbArr));
      }
    }

    // --- Q 版快打旋風「龍 (Ryu)」角色繪製 ---
    function drawPlayerShip() {
      push();
      translate(shipPos.x, shipPos.y);

      // 手勢合併準心與氣流感應圈
      drawingContext.shadowBlur = 20;
      drawingContext.shadowColor = handPos.isMerged ? 'rgba(56, 189, 248, 0.9)' : 'rgba(251, 146, 60, 0.9)';
      
      noFill();
      stroke(handPos.isMerged ? '#38bdf8' : '#fb923c');
      strokeWeight(handPos.isMerged ? 3 : 2);
      circle(0, 0, 68 + (handPos.isMerged ? sin(frameCount * 0.3) * 5 : random(-2, 2)));

      // 1. 腳下爆氣光環 (併指蓄氣效果)
      if (handPos.isMerged) {
        fill(56, 189, 248, 60);
        noStroke();
        ellipse(0, 28, 55, 18);
      }

      // 2. Q 版「龍」角色本體
      noStroke();

      // (A) 經典黑色刺蝟短髮
      fill(24, 24, 27);
      ellipse(0, -22, 34, 30);
      triangle(-16, -26, -6, -36, 0, -26);
      triangle(-6, -30, 8, -38, 12, -24);
      triangle(4, -28, 18, -32, 16, -20);

      // (B) 經典紅色頭巾 (飄帶向後飄揚)
      fill(225, 29, 72);
      rect(-17, -24, 34, 8, 3);
      // 頭巾飄帶
      push();
      translate(15, -22);
      rotate(sin(frameCount * 0.15) * 0.2 + 0.3);
      triangle(0, -3, 22, -8, 18, 5);
      triangle(0, 0, 26, 6, 20, 14);
      pop();

      // (C) 濃眉大眼 Q 版臉蛋
      fill(254, 215, 170); // 膚色
      ellipse(0, -10, 28, 22);

      // 濃黑眉毛
      stroke(24, 24, 27);
      strokeWeight(3);
      line(-9, -15, -2, -12);
      line(2, -12, 9, -15);

      // 大眼與自信眼神
      noStroke();
      fill(24, 24, 27);
      circle(-5, -9, 5);
      circle(5, -9, 5);
      fill(255);
      circle(-6, -10, 2);
      circle(4, -10, 2);

      // (D) 白色無袖道服 & 肌肉手臂
      fill(255, 255, 255); // 白道服
      rect(-15, 0, 30, 26, 4);
      fill(220, 38, 38); // 紅領口黑色腰帶
      rect(-4, 0, 8, 24);
      fill(24, 24, 27);
      rect(-16, 20, 32, 6, 2); // 黑帶

      // (E) 手臂與紅色拳套 (出拳推氣姿態)
      fill(254, 215, 170);
      ellipse(-17, 8, 10, 16); // 左臂
      ellipse(17, 8, 10, 16);  // 右臂

      fill(225, 29, 72); // 經典紅拳套
      circle(-16, 18, 12);
      circle(16, 18, 12);

      // 3. 兩指合併時於拳頭前方聚集藍色氣功球
      if (handPos.isMerged) {
        drawingContext.shadowBlur = 15;
        drawingContext.shadowColor = '#38bdf8';
        fill(255, 255, 255, 230);
        circle(0, -32, 14 + sin(frameCount * 0.4) * 4);
        fill(56, 189, 248, 160);
        circle(0, -32, 26 + sin(frameCount * 0.4) * 6);
      }

      pop();
    }

    // --- 遊戲流程結束與控制 ---
    function endGame(isWin) {
      gameState = "GAMEOVER";
      document.getElementById('endTitle').innerText = isWin ? "🎉 冒險完全通關！" : "💔 冒險中途結束";
      document.getElementById('endSubText').innerText = isWin ? "太厲害了！你徹底征服了正負數加減法！" : "挑戰結界突破，再試一次吧！";

      document.getElementById('finalScore').innerText = `${score} / ${TOTAL_QUESTIONS}`;
      let accuracy = Math.round((score / (currentQIndex > 0 ? currentQIndex + (isWin ? 0 : 1) : 1)) * 100);
      document.getElementById('finalAccuracy').innerText = `${accuracy}%`;

      let m = Math.floor(elapsedTime / 60);
      let s = elapsedTime % 60;
      document.getElementById('finalTime').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

      let goUI = document.getElementById('gameOverUI');
      goUI.classList.remove('opacity-0', 'pointer-events-none');
      goUI.classList.add('opacity-100', 'pointer-events-auto');
    }

    function restartGame() {
      score = 0;
      lives = MAX_LIVES;
      currentQIndex = 0;
      bullets = [];
      particles = [];

      document.getElementById('scoreDisplay').innerText = `0 / ${TOTAL_QUESTIONS}`;
      document.getElementById('healthDisplay').innerText = "♥♥♥";

      generateQuestions();
      loadQuestion(0);

      let goUI = document.getElementById('gameOverUI');
      goUI.classList.remove('opacity-100', 'pointer-events-auto');
      goUI.classList.add('opacity-0', 'pointer-events-none');

      startTime = millis();
      gameState = "PLAYING";
    }

    // 註冊 Service Worker (PWA 支援)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(registration => {
          console.log('ServiceWorker 註冊成功，範圍為: ', registration.scope);
        }).catch(err => {
          console.log('ServiceWorker 註冊失敗: ', err);
        });
      });
    }
  </script>
</body>
